name: Build & Verify IPTV Playlist

on:
  push:
    branches: [ main, master ]
    paths:
      - 'channels/**'
      - 'scripts/**'
  schedule:
    # Corre automáticamente todos los días a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar listas y verificar canales
        run: |
          python scripts/build.py --check

      - name: Auto-commit cambios compilados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): auto-actualizar playlist.m3u y salta.m3u"
          file_pattern: "*.m3u"
